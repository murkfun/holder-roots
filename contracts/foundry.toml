# The deployed MurkFunHolderRoots and BatchVerifier, compiled with the deployment's settings. src/ and lib/ are
# byte-identical copies of the files the deployment was compiled from, laid out the same way (the build's runtime code
# equals the deployed code: npm run verify-bytecode).
#   forge build    (or `npm run verify-bytecode` one folder up: build + compare with the chain)
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]

[lint]
lint_on_build = false
